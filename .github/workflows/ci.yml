name: FitData Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:

  # =========================================================================
  # JOB 1: Frontend Verification (HTML5, JS, CSS)
  # =========================================================================
  frontend-check:
    name: Frontend Check & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Validate HTML Files (Syntax & Semantic Structure)
        run: npx htmlhint "frontend/**/*.html"

      - name: Check JavaScript Modules Syntax
        run: |
          for file in frontend/js/*.js; do
            echo "Checking syntax for $file..."
            node --check "$file"
          done

      - name: Verify CSS Core Files Exist
        run: |
          test -f frontend/css/tokens.css && echo "tokens.css OK"
          test -f frontend/css/main.css   && echo "main.css OK"

  # =========================================================================
  # JOB 2: Backend & DE Pipeline (Python Pytest & Linting)
  # =========================================================================
  backend-ci:
    name: Backend API & DE Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'        # fixed: was 'python-python-version'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r de_pipeline/requirements.txt
          pip install -r backend/requirements.txt

      - name: Python Syntax & Critical Lint Check (flake8)
        run: |
          flake8 . \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=impeccable,taste-skill,spec-kit,.git,__pycache__

      - name: Python Style Lint (warnings only)
        run: |
          flake8 . \
            --count --exit-zero \
            --max-complexity=10 --max-line-length=120 \
            --statistics \
            --exclude=impeccable,taste-skill,spec-kit,.git,__pycache__

      - name: Run Pytest Unit Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v \
            --cov=backend \
            --cov=de_pipeline \
            --cov-report=term-missing \
            --cov-fail-under=50

  # =========================================================================
  # JOB 3: Docker Build & Integration Check
  # Runs only after both frontend and backend jobs pass.
  # =========================================================================
  docker-ci:
    name: Docker Build & Integration Test
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Validate compose config ----------------------------------------
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid."

      # ---- Build images (no push) ------------------------------------------
      - name: Build DE Pipeline Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./de_pipeline/Dockerfile
          push: false
          tags: fitdata-de-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: fitdata-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Integration test: DB + Backend only (no ETL data needed) --------
      - name: Start PostgreSQL & Backend (integration)
        run: |
          cp .env.example .env
          # Start only db and backend; skip etl (requires real exercise data)
          docker compose up -d db
          echo "Waiting for Postgres to be healthy..."
          timeout 60 bash -c 'until docker compose ps db | grep -q "healthy"; do sleep 2; done'

          # Start backend with relaxed etl dependency for CI
          docker compose run -d \
            -e DB_HOST=db \
            -e SKIP_ETL=true \
            --name fitdata_backend_ci \
            --service-ports \
            backend || true

          # Alternatively: run backend image directly against db
          docker run -d \
            --name fitdata_backend_test \
            --network "$(docker compose ls -q | head -1)_default" \
            -p 8000:8000 \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_NAME=${POSTGRES_DB:-fitdata} \
            -e DB_USER=${POSTGRES_USER:-fitdata} \
            -e DB_PASSWORD=${POSTGRES_PASSWORD:-fitdata_secret_change_me} \
            fitdata-backend:ci || true

          sleep 8

      - name: Verify Backend Health Endpoint
        run: |
          echo "Checking /api/health..."
          curl --retry 5 --retry-delay 3 --retry-connrefused \
               -f http://localhost:8000/api/health \
            && echo "Health check PASSED" \
            || (echo "Health check FAILED — printing logs:" \
                && docker logs fitdata_backend_test 2>&1 || true \
                && exit 1)

      - name: Tear Down
        if: always()
        run: |
          docker rm -f fitdata_backend_test fitdata_backend_ci 2>/dev/null || true
          docker compose down -v
