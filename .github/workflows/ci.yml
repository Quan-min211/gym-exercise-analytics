name: FitData Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:

  # =========================================================================
  # JOB 1: Frontend Verification (HTML5, JS, CSS)
  # =========================================================================
  frontend-check:
    name: Frontend Check & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint & Linters
        run: |
          npm install -g htmlhint

      - name: Validate HTML Files (Syntax & Semantic Structure)
        run: |
          npx htmlhint "frontend/**/*.html"

      - name: Check JavaScript Modules Syntax
        run: |
          for file in frontend/js/*.js; do
            echo "Checking syntax for $file..."
            node --check "$file"
          done

      - name: Verify CSS Syntax & Tokens
        run: |
          test -f frontend/css/tokens.css
          test -f frontend/css/main.css
          echo "CSS core files verified."

  # =========================================================================
  # JOB 2: Backend & DE Pipeline (Python Pytest & Linting)
  # =========================================================================
  backend-ci:
    name: Backend API & DE Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r de_pipeline/requirements.txt
          pip install -r backend/requirements.txt

      - name: Python Syntax & Lint Check (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=impeccable,taste-skill,spec-kit
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=impeccable,taste-skill,spec-kit

      - name: Run Pytest Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=backend --cov=de_pipeline --cov-report=term-missing

  # =========================================================================
  # JOB 3: Docker & Integration Build
  # =========================================================================
  docker-ci:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Build DE Pipeline Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./de_pipeline/Dockerfile
          push: false
          tags: fitdata-de-pipeline:test

      - name: Build Backend API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: fitdata-backend:test

      - name: Full Stack Integration Test (Docker Compose)
        run: |
          cp .env.example .env
          docker compose up -d --build
          echo "Waiting for services to initialize..."
          sleep 10
          docker compose ps
          # Health check endpoint verification
          curl -f http://localhost:8000/api/health || (docker compose logs && exit 1)
          echo "Full Stack Integration Test Successful!"
          docker compose down
