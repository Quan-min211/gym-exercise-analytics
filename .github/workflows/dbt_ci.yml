name: dbt TiDB Pipeline

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  run-dbt:
    name: Run dbt Transformations on TiDB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: Run dbt Transformations
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT || '4000' }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE || 'fitdata' }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          DBT_PROFILES_DIR: ./dbt
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          cd dbt
          dbt debug
          dbt run --target prod
          dbt test --target prod

